name: CI

# Roda typecheck + testes a cada push e pull request. Sem isto, a suíte só
# rodava na máquina de quem lembrasse; o build da Vercel nunca a executa.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Testes
        run: pnpm test
